<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link rel="manifest" href="./manifest.json">
    <title>Track Your Expense - Premium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDUom1M1DuOG73ezjmjcXAH5YCnOTmftdc",
            authDomain: "track-your-expense-d253f.firebaseapp.com",
            projectId: "track-your-expense-d253f",
            storageBucket: "track-your-expense-d253f.firebasestorage.app",
            messagingSenderId: "808570038456",
            appId: "1:808570038456:web:8f9c5005bc2e6fc5a22c4d",
            measurementId: "G-H11W1EN2G6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        // Critical Fix: Initialize DB to stop cached app crashes
        const db = firebase.firestore(); 
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        /* Smooth transitions */
        .page-enter { animation: fadeUp 0.3s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Hide scrollbar on mobile, show on desktop */
        @media (max-width: 768px) {
            .no-scrollbar::-webkit-scrollbar { display: none; }
            .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        }
        
        /* Glass effect */
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
    </style>
</head>
<body>

    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister().then(() => console.log("Cache cleared for update."));
                } 
            });
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- UTILS ---
        const formatCurrency = (amount) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amount);
        const generateId = () => `TXN-${Date.now().toString().slice(-6)}-${Math.floor(Math.random()*1000)}`;

        // --- SIDEBAR COMPONENT (NEW: For Laptop/Desktop) ---
        const Sidebar = ({ view, setView, onLogout, profile }) => (
            <div className="hidden md:flex flex-col w-64 bg-white h-screen fixed left-0 top-0 border-r border-gray-200 z-50">
                <div className="p-6 flex items-center gap-3">
                    <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-xl shadow-lg">
                        <i className="fa-solid fa-wallet"></i>
                    </div>
                    <h1 className="font-bold text-gray-800 text-lg leading-tight">Expense<br/>Tracker</h1>
                </div>
                
                <div className="flex-1 px-4 py-4 space-y-2">
                    {[
                        { id: 'dashboard', icon: 'fa-house', label: 'Dashboard' },
                        { id: 'analytics', icon: 'fa-chart-pie', label: 'Analytics' },
                        { id: 'settings', icon: 'fa-gear', label: 'Settings' }
                    ].map(item => (
                        <button 
                            key={item.id}
                            onClick={() => setView(item.id)}
                            className={`w-full flex items-center gap-4 px-4 py-3 rounded-xl transition-all duration-200 font-medium ${view === item.id ? 'bg-indigo-50 text-indigo-600 shadow-sm' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900'}`}
                        >
                            <i className={`fa-solid ${item.icon} w-6 text-center`}></i>
                            {item.label}
                        </button>
                    ))}
                </div>

                <div className="p-4 border-t border-gray-100">
                    <div className="bg-gray-50 rounded-xl p-4 mb-4">
                        <p className="text-xs text-gray-500 uppercase font-bold mb-1">Current Profile</p>
                        <p className="font-bold text-gray-800 truncate">{profile?.fullName}</p>
                        <span className="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-bold">
                            {profile?.type === 'commercial' ? 'BUSINESS' : 'PERSONAL'}
                        </span>
                    </div>
                    <button onClick={onLogout} className="w-full flex items-center justify-center gap-2 text-red-500 hover:bg-red-50 py-2 rounded-lg transition font-medium text-sm">
                        <i className="fa-solid fa-right-from-bracket"></i> Sign Out
                    </button>
                </div>
            </div>
        );

        // --- MOBILE NAV (Phone/Tablet Portrait) ---
        const MobileNav = ({ view, setView }) => (
            <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-gray-200 flex justify-around items-center pb-safe pt-2 pb-2 z-50">
                {[
                    { id: 'dashboard', icon: 'fa-house', label: 'Home' },
                    { id: 'analytics', icon: 'fa-chart-simple', label: 'Insights' },
                    { id: 'settings', icon: 'fa-gear', label: 'Settings' }
                ].map(item => (
                    <button 
                        key={item.id}
                        onClick={() => setView(item.id)}
                        className={`flex flex-col items-center gap-1 p-2 min-w-[64px] transition-colors ${view === item.id ? 'text-indigo-600' : 'text-gray-400'}`}
                    >
                        <i className={`fa-solid ${item.icon} text-xl ${view === item.id ? 'animate-bounce-short' : ''}`}></i>
                        <span className="text-[10px] font-bold">{item.label}</span>
                    </button>
                ))}
            </div>
        );

        // --- CHART COMPONENT ---
        const ChartCard = ({ title, type, data, options }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (canvasRef.current) {
                    if (chartRef.current) chartRef.current.destroy();
                    const ctx = canvasRef.current.getContext('2d');
                    chartRef.current = new Chart(ctx, { type, data, options });
                }
                return () => { if(chartRef.current) chartRef.current.destroy(); };
            }, [data, type]);

            return (
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-full flex flex-col">
                    <h3 className="text-gray-500 text-xs font-bold uppercase tracking-wider mb-4">{title}</h3>
                    <div className="relative flex-1 min-h-[250px]">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD ---
        const DashboardView = ({ transactions, profile, onAdd, onRemove, onStatement }) => {
            const stats = useMemo(() => {
                const income = transactions.filter(t => t.type === 'credit').reduce((acc, t) => acc + t.amount, 0);
                const expense = transactions.filter(t => t.type === 'debit').reduce((acc, t) => acc + t.amount, 0);
                return { income, expense, balance: income - expense };
            }, [transactions]);

            return (
                <div className="page-enter space-y-6">
                    {/* Header Stats - Responsive Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        {/* Main Balance Card */}
                        <div className="lg:col-span-2 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden flex flex-col justify-between min-h-[200px]">
                            <div className="absolute top-0 right-0 p-6 opacity-20">
                                <i className="fa-solid fa-wallet text-9xl transform rotate-12 translate-x-4 -translate-y-4"></i>
                            </div>
                            <div className="relative z-10">
                                <div className="flex items-center gap-2 mb-2 opacity-80">
                                    <span className="text-sm font-medium uppercase tracking-wider">Total Balance</span>
                                    <span className="bg-white/20 px-2 py-0.5 rounded text-[10px] font-bold">{profile.type === 'commercial' ? 'BUSINESS' : 'PERSONAL'}</span>
                                </div>
                                <h1 className="text-5xl font-bold tracking-tight">{formatCurrency(stats.balance)}</h1>
                            </div>
                            <div className="relative z-10 mt-6 flex gap-8">
                                <div>
                                    <div className="text-indigo-200 text-xs mb-1 font-bold">INCOME</div>
                                    <div className="text-xl font-bold flex items-center gap-1">
                                        <i className="fa-solid fa-arrow-down text-green-400 text-sm"></i> {formatCurrency(stats.income)}
                                    </div>
                                </div>
                                <div>
                                    <div className="text-indigo-200 text-xs mb-1 font-bold">EXPENSE</div>
                                    <div className="text-xl font-bold flex items-center gap-1">
                                        <i className="fa-solid fa-arrow-up text-red-400 text-sm"></i> {formatCurrency(stats.expense)}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Quick Actions Card */}
                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex flex-col justify-center h-full">
                            <h3 className="text-gray-500 text-xs font-bold uppercase mb-4">Quick Actions</h3>
                            <div className="grid grid-cols-2 gap-3 h-full">
                                <button onClick={onAdd} className="bg-green-50 hover:bg-green-100 text-green-700 rounded-xl p-4 flex flex-col items-center justify-center gap-2 transition-colors group">
                                    <div className="w-10 h-10 bg-green-200 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform"><i className="fa-solid fa-plus"></i></div>
                                    <span className="font-bold text-sm">Deposit</span>
                                </button>
                                <button onClick={onRemove} className="bg-red-50 hover:bg-red-100 text-red-700 rounded-xl p-4 flex flex-col items-center justify-center gap-2 transition-colors group">
                                    <div className="w-10 h-10 bg-red-200 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform"><i className="fa-solid fa-minus"></i></div>
                                    <span className="font-bold text-sm">Withdraw</span>
                                </button>
                                <button onClick={onStatement} className="col-span-2 bg-slate-50 hover:bg-slate-100 text-slate-700 rounded-xl p-3 flex items-center justify-center gap-2 transition-colors border border-slate-200">
                                    <i className="fa-solid fa-file-pdf text-slate-400"></i>
                                    <span className="font-bold text-sm">Download Statement</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Transactions List */}
                    <div className="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="p-6 border-b border-gray-50 flex justify-between items-center">
                            <h3 className="text-gray-800 font-bold text-lg">Recent Transactions</h3>
                            <span className="text-xs text-gray-400 font-medium">{transactions.length} Records</span>
                        </div>
                        
                        <div className="divide-y divide-gray-50 max-h-[600px] overflow-y-auto">
                            {transactions.length === 0 ? (
                                <div className="py-16 text-center text-gray-400">
                                    <i className="fa-solid fa-receipt text-4xl mb-3 opacity-30"></i>
                                    <p>No recent activity</p>
                                </div>
                            ) : (
                                transactions.map((t) => (
                                    <div key={t.id} className="p-4 hover:bg-gray-50 transition flex items-center justify-between group">
                                        <div className="flex items-center gap-4">
                                            <div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-sm ${t.type === 'credit' ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600'}`}>
                                                <i className={`fa-solid ${t.mode === 'UPI' ? 'fa-qrcode' : t.mode === 'Cash' ? 'fa-coins' : 'fa-building-columns'}`}></i>
                                            </div>
                                            <div>
                                                <p className="font-bold text-gray-800">{t.partyName}</p>
                                                <p className="text-xs text-gray-400 flex items-center gap-2">
                                                    <span>{new Date(t.date).toLocaleDateString()}</span>
                                                    <span className="w-1 h-1 bg-gray-300 rounded-full"></span>
                                                    <span className="bg-gray-100 px-1.5 rounded text-[10px] font-medium text-gray-500 uppercase">{t.mode}</span>
                                                </p>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <p className={`font-bold text-lg ${t.type === 'credit' ? 'text-green-600' : 'text-red-600'}`}>
                                                {t.type === 'credit' ? '+' : '-'}{formatCurrency(t.amount)}
                                            </p>
                                            {t.remarks && <p className="text-xs text-gray-400 italic max-w-[150px] truncate">{t.remarks}</p>}
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- ANALYTICS ---
        const AnalyticsView = ({ transactions }) => {
            const chartData = useMemo(() => {
                const days = {};
                transactions.forEach(t => {
                    const date = new Date(t.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
                    if (!days[date]) days[date] = { credit: 0, debit: 0 };
                    if (t.type === 'credit') days[date].credit += t.amount;
                    else days[date].debit += t.amount;
                });
                const labels = Object.keys(days).slice(-7);
                const modes = {};
                transactions.forEach(t => { if (!modes[t.mode]) modes[t.mode] = 0; modes[t.mode] += t.amount; });
                
                return {
                    line: {
                        labels,
                        datasets: [
                            { label: 'Income', data: labels.map(d => days[d].credit), borderColor: '#10b981', tension: 0.4, fill: true, backgroundColor: 'rgba(16, 185, 129, 0.1)' },
                            { label: 'Expense', data: labels.map(d => days[d].debit), borderColor: '#ef4444', tension: 0.4, fill: true, backgroundColor: 'rgba(239, 68, 68, 0.1)' }
                        ]
                    },
                    doughnut: {
                        labels: Object.keys(modes),
                        datasets: [{ data: Object.values(modes), backgroundColor: ['#6366f1', '#f59e0b', '#10b981', '#ec4899'] }]
                    }
                };
            }, [transactions]);

            if(transactions.length < 2) return <div className="h-full flex items-center justify-center text-gray-400">Add more data to visualize analytics</div>;

            return (
                <div className="page-enter space-y-6">
                    <h1 className="text-2xl font-bold text-gray-800">Financial Insights</h1>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 h-full">
                        <ChartCard title="Income vs Expense (Last 7 Days)" type="line" data={chartData.line} options={{ responsive: true, maintainAspectRatio: false }} />
                        <ChartCard title="Payment Modes Volume" type="doughnut" data={chartData.doughnut} options={{ responsive: true, maintainAspectRatio: false, cutout: '60%' }} />
                    </div>
                </div>
            );
        };

        // --- SETTINGS ---
        const SettingsView = ({ profile, user, onLogout, onReset, onDelete, onUpdateProfile }) => (
            <div className="page-enter max-w-2xl mx-auto">
                <h1 className="text-2xl font-bold text-gray-800 mb-8">Account Settings</h1>
                
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6 flex items-center gap-6">
                    <img src={user.photoURL} className="w-20 h-20 rounded-full border-4 border-indigo-50" />
                    <div>
                        <h2 className="font-bold text-xl text-gray-900">{profile.fullName}</h2>
                        <p className="text-gray-500">{user.email}</p>
                        {profile.shopName && <p className="text-sm text-indigo-600 font-medium mt-1"><i className="fa-solid fa-store mr-1"></i> {profile.shopName}</p>}
                    </div>
                </div>

                <div className="space-y-4">
                    <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                        <div>
                            <h4 className="font-bold text-gray-800">Profile Mode</h4>
                            <p className="text-sm text-gray-500">Switch between Personal and Business</p>
                        </div>
                        <button 
                            onClick={() => onUpdateProfile({ ...profile, type: profile.type === 'commercial' ? 'personal' : 'commercial' })} 
                            className={`px-4 py-2 rounded-lg font-bold text-sm transition ${profile.type === 'commercial' ? 'bg-indigo-100 text-indigo-700' : 'bg-green-100 text-green-700'}`}
                        >
                            {profile.type.toUpperCase()}
                        </button>
                    </div>

                    <button onClick={onReset} className="w-full bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between hover:bg-gray-50 transition group">
                        <span className="font-bold text-gray-700"><i className="fa-solid fa-eraser text-orange-500 mr-3"></i> Clear All Data</span>
                        <i className="fa-solid fa-chevron-right text-gray-300 group-hover:text-gray-500"></i>
                    </button>

                    <button onClick={onLogout} className="w-full bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between hover:bg-gray-50 transition group">
                        <span className="font-bold text-gray-700"><i className="fa-solid fa-right-from-bracket text-gray-500 mr-3"></i> Sign Out</span>
                        <i className="fa-solid fa-chevron-right text-gray-300 group-hover:text-gray-500"></i>
                    </button>

                    <div className="bg-red-50 p-6 rounded-2xl border border-red-100 mt-8">
                        <h4 className="text-red-800 font-bold mb-2">Danger Zone</h4>
                        <p className="text-red-600 text-sm mb-4">Permanently delete your account and all associated data. This cannot be undone.</p>
                        <button onClick={onDelete} className="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-red-700 w-full sm:w-auto">
                            Delete Account
                        </button>
                    </div>
                </div>
                
                <div className="mt-12 text-center text-xs text-gray-400">
                    <p>Track Your Expense v5.0</p>
                    <p>Developed by Bhavishya Gupta</p>
                </div>
            </div>
        );

        // --- LOGIN & ONBOARDING ---
        const Login = () => {
            const signIn = async () => { try { await auth.signInWithPopup(provider); } catch (e) { alert(e.message); } };
            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 to-slate-900 p-4">
                    <div className="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-md text-center">
                        <div className="w-20 h-20 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-indigo-200"><i className="fa-solid fa-chart-pie text-4xl text-white"></i></div>
                        <h1 className="text-3xl font-bold text-gray-900 mb-2">Track Your Expense</h1>
                        <p className="text-gray-500 mb-8">Pro Financial Dashboard</p>
                        <button onClick={signIn} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 transition flex items-center justify-center gap-3 shadow-lg shadow-indigo-200"><i className="fa-brands fa-google text-xl"></i> Continue with Google</button>
                    </div>
                </div>
            );
        };

        const Onboarding = ({ user, onComplete }) => {
            const [details, setDetails] = useState({ type: 'personal', fullName: user.displayName || '', shopName: '', franchiseName: '', phone: '' });
            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl shadow-xl max-w-lg w-full p-8">
                        <h2 className="text-2xl font-bold text-gray-800 mb-6">Setup Profile</h2>
                        <form onSubmit={(e) => { e.preventDefault(); onComplete(details); }} className="space-y-4">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">Account Type</label>
                                <div className="grid grid-cols-2 gap-4">
                                    {['personal', 'commercial'].map(t => (
                                        <button type="button" key={t} onClick={() => setDetails({...details, type: t})} className={`py-3 rounded-xl font-bold capitalize border-2 transition ${details.type === t ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'border-gray-200 text-gray-500'}`}>{t}</button>
                                    ))}
                                </div>
                            </div>
                            <input type="text" placeholder="Full Name" required className="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:border-indigo-500" value={details.fullName} onChange={e => setDetails({...details, fullName: e.target.value})} />
                            {details.type === 'commercial' && (<>
                                <input type="text" placeholder="Shop Name" required className="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:border-indigo-500" value={details.shopName} onChange={e => setDetails({...details, shopName: e.target.value})} />
                                <input type="text" placeholder="GST (Optional)" className="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:border-indigo-500" value={details.franchiseName} onChange={e => setDetails({...details, franchiseName: e.target.value})} />
                            </>)}
                            <input type="tel" placeholder="Phone Number" required className="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:border-indigo-500" value={details.phone} onChange={e => setDetails({...details, phone: e.target.value})} />
                            <button className="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 mt-4">Complete Setup</button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- APP ROOT ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [view, setView] = useState('dashboard');
            const [transactions, setTransactions] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalType, setModalType] = useState('credit');
            const [form, setForm] = useState({ amount: '', partyName: '', mode: 'UPI', remarks: '' });

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    if(u) {
                        setUser(u);
                        const p = localStorage.getItem(`profile_${u.email}`);
                        if(p) setProfile(JSON.parse(p));
                        const t = localStorage.getItem(`expenses_${u.email}`);
                        if(t) setTransactions(JSON.parse(t));
                    } else { setUser(null); setProfile(null); }
                    setLoading(false);
                });
                return () => unsub();
            }, []);

            useEffect(() => { if(user) localStorage.setItem(`expenses_${user.email}`, JSON.stringify(transactions)); }, [transactions, user]);
            const updateProfile = (p) => { setProfile(p); localStorage.setItem(`profile_${user.email}`, JSON.stringify(p)); };

            const addTxn = (e) => {
                e.preventDefault();
                if(!form.amount || !form.partyName) return;
                const newT = { id: generateId(), date: new Date().toISOString(), type: modalType, ...form, amount: parseFloat(form.amount) };
                setTransactions([newT, ...transactions]);
                setIsModalOpen(false);
                setForm({ amount: '', partyName: '', mode: 'UPI', remarks: '' });
            };

            const resetData = () => {
                if(confirm("Reset all transactions? This cannot be undone.")) setTransactions([]);
            };

            const deleteAccount = async () => {
                if(confirm("PERMANENTLY DELETE ACCOUNT? All data will be lost forever.")) {
                    localStorage.clear();
                    try { await auth.currentUser.delete(); } catch(e) { await auth.signOut(); }
                    window.location.reload();
                }
            };

            const generatePDF = () => {
                const doc = new window.jspdf.jsPDF();
                doc.setFillColor(79, 70, 229); doc.rect(0,0,210,45,'F');
                doc.setTextColor(255,255,255); doc.setFontSize(24); doc.text("Track Your Expense", 14, 20);
                doc.setFontSize(12); doc.text("Financial Statement", 14, 32);
                
                doc.setTextColor(0,0,0); doc.setFontSize(10);
                doc.text(`Generated By: Bhavishya Gupta`, 14, 55);
                doc.text(`User: ${profile.fullName}`, 14, 60);
                doc.text(`Email: bhavishyagupta22@gmail.com`, 14, 65);
                doc.text(`Date: ${new Date().toLocaleDateString()}`, 150, 55);

                const rows = transactions.map(t => [new Date(t.date).toLocaleDateString(), t.partyName, t.mode, t.type==='credit'?t.amount:'-', t.type==='debit'?t.amount:'-']);
                doc.autoTable({ head: [['Date', 'Party', 'Mode', 'Credit', 'Debit']], body: rows, startY: 75, theme: 'grid', headStyles: {fillColor: [79, 70, 229]} });
                doc.save(`Statement_${profile.fullName}.pdf`);
            };

            if (loading) return <div className="h-screen flex items-center justify-center text-indigo-600"><i className="fa-solid fa-circle-notch fa-spin text-3xl"></i></div>;
            if (!user) return <Login />;
            if (!profile) return <Onboarding user={user} onComplete={updateProfile} />;

            return (
                <div className="flex min-h-screen bg-gray-50">
                    <Sidebar view={view} setView={setView} onLogout={()=>auth.signOut()} profile={profile} />
                    
                    <div className="flex-1 md:ml-64 pb-20 md:pb-0">
                        {view === 'dashboard' && <DashboardView transactions={transactions} profile={profile} onAdd={()=>{setModalType('credit');setIsModalOpen(true)}} onRemove={()=>{setModalType('debit');setIsModalOpen(true)}} onStatement={generatePDF} />}
                        {view === 'analytics' && <AnalyticsView transactions={transactions} />}
                        {view === 'settings' && <SettingsView profile={profile} user={user} onLogout={()=>auth.signOut()} onReset={resetData} onDelete={deleteAccount} onUpdateProfile={updateProfile} />}
                    </div>
                    
                    <MobileNav view={view} setView={setView} />

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4" onClick={(e)=>e.target===e.currentTarget&&setIsModalOpen(false)}>
                            <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl page-enter">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className={`text-xl font-bold ${modalType==='credit'?'text-green-600':'text-red-600'}`}>{modalType==='credit'?'Add Income':'Add Expense'}</h3>
                                    <button onClick={()=>setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <form onSubmit={addTxn} className="space-y-4">
                                    <input autoFocus type="number" placeholder="Amount" required className="w-full text-3xl font-bold text-gray-800 border-b-2 py-2 focus:border-indigo-600 outline-none" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} />
                                    <input type="text" placeholder="Party Name" required className="w-full p-3 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={form.partyName} onChange={e=>setForm({...form,partyName:e.target.value})} />
                                    <div className="flex gap-2 overflow-x-auto py-2">
                                        {['UPI','Cash','Bank','Card','Cheque'].map(m=><button type="button" key={m} onClick={()=>setForm({...form,mode:m})} className={`px-3 py-1.5 rounded-full text-sm font-bold border transition ${form.mode===m?'bg-indigo-600 text-white border-indigo-600':'border-gray-200 text-gray-600 hover:bg-gray-50'}`}>{m}</button>)}
                                    </div>
                                    <input type="text" placeholder="Remarks (Optional)" className="w-full p-3 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={form.remarks} onChange={e=>setForm({...form,remarks:e.target.value})} />
                                    <button className={`w-full py-4 rounded-xl text-white font-bold shadow-lg mt-2 ${modalType==='credit'?'bg-green-600 hover:bg-green-700':'bg-red-600 hover:bg-red-700'}`}>Confirm Transaction</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
