<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <title>Track Your Expense - Account Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-gray-100">

    <div id="root"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDUom1M1DuOG73ezjmjcXAH5YCnOTmftdc",
            authDomain: "track-your-expense-d253f.firebaseapp.com",
            projectId: "track-your-expense-d253f",
            storageBucket: "track-your-expense-d253f.firebasestorage.app",
            messagingSenderId: "808570038456",
            appId: "1:808570038456:web:8f9c5005bc2e6fc5a22c4d",
            measurementId: "G-H11W1EN2G6"
        };

        // Initialize Firebase immediately
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 1. LOGIN COMPONENT (Android Fixed) ---
        const Login = () => {
            const handleLogin = async () => {
                try {
                    // FIXED: Uses signInWithPopup instead of Redirect to work inside Android App
                    await auth.signInWithPopup(provider); 
                } catch (error) {
                    console.error("Login Failed:", error);
                    alert("Login failed. Please try again.");
                }
            };

            return (
                <div className="flex h-screen items-center justify-center bg-gradient-to-br from-indigo-50 to-blue-100 p-4">
                    <div className="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl text-center">
                        <div className="mb-6 flex justify-center">
                            <div className="flex h-20 w-20 items-center justify-center rounded-full bg-indigo-100 text-4xl text-indigo-600">
                                <i className="fa-solid fa-wallet"></i>
                            </div>
                        </div>
                        <h1 className="mb-2 text-3xl font-bold text-gray-800">Track Your Expense</h1>
                        <p className="mb-8 text-gray-500">Manage your finances with ease.</p>
                        
                        <button 
                            onClick={handleLogin}
                            className="flex w-full items-center justify-center gap-3 rounded-xl bg-indigo-600 py-3 font-semibold text-white transition-transform hover:scale-105 hover:bg-indigo-700 active:scale-95 shadow-lg shadow-indigo-200"
                        >
                            <i className="fa-brands fa-google text-lg"></i>
                            Sign in with Google
                        </button>
                        
                        <p className="mt-8 text-xs text-gray-400">Secure authentication powered by Firebase</p>
                    </div>
                </div>
            );
        };

        // --- 2. ONBOARDING COMPONENT ---
        const Onboarding = ({ user, onComplete }) => {
            const [formData, setFormData] = useState({
                name: user.displayName || "",
                salary: "",
                currency: "₹"
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.salary) return alert("Please enter your salary");
                onComplete(formData);
            };

            return (
                <div className="flex h-screen items-center justify-center bg-gray-50 p-4">
                    <form onSubmit={handleSubmit} className="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
                        <h2 className="mb-6 text-2xl font-bold text-gray-800">Welcome! 👋</h2>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Display Name</label>
                                <input 
                                    type="text" 
                                    value={formData.name} 
                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                    className="mt-1 w-full rounded-lg border border-gray-300 p-2 focus:border-indigo-500 focus:outline-none"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Monthly Salary</label>
                                <input 
                                    type="number" 
                                    value={formData.salary} 
                                    onChange={(e) => setFormData({...formData, salary: e.target.value})}
                                    className="mt-1 w-full rounded-lg border border-gray-300 p-2 focus:border-indigo-500 focus:outline-none"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Currency Symbol</label>
                                <select 
                                    value={formData.currency} 
                                    onChange={(e) => setFormData({...formData, currency: e.target.value})}
                                    className="mt-1 w-full rounded-lg border border-gray-300 p-2"
                                >
                                    <option value="₹">₹ (INR)</option>
                                    <option value="$">$ (USD)</option>
                                    <option value="€">€ (EUR)</option>
                                    <option value="£">£ (GBP)</option>
                                </select>
                            </div>
                            <button type="submit" className="mt-4 w-full rounded-xl bg-indigo-600 py-3 font-bold text-white hover:bg-indigo-700">
                                Get Started
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        // --- 3. DASHBOARD COMPONENT (Reset Button Added) ---
        const Dashboard = ({ user, profile, onLogout }) => {
            const [transactions, setTransactions] = useState([]);

            useEffect(() => {
                const savedDocs = localStorage.getItem(`transactions_${user.email}`);
                if (savedDocs) setTransactions(JSON.parse(savedDocs));
            }, [user.email]);

            useEffect(() => {
                localStorage.setItem(`transactions_${user.email}`, JSON.stringify(transactions));
            }, [transactions, user.email]);

            const totalExpenses = transactions.reduce((sum, t) => sum + Number(t.amount), 0);
            const balance = Number(profile.salary) - totalExpenses;

            const addTransaction = () => {
                const desc = prompt("Expense Description (e.g., Grocery):");
                if (!desc) return;
                const amount = prompt("Amount:");
                if (!amount || isNaN(amount)) return;

                const newTrans = {
                    id: Date.now(),
                    date: new Date().toLocaleDateString(),
                    desc,
                    amount: Number(amount)
                };
                setTransactions([newTrans, ...transactions]);
            };

            const removeTransaction = () => {
                if (transactions.length === 0) return alert("No transactions to remove!");
                const newTrans = [...transactions];
                newTrans.shift(); 
                setTransactions(newTrans);
            };

            // --- NEW FUNCTION: Reset Data ---
            const clearAllTransactions = () => {
                if (window.confirm("Are you sure you want to delete ALL transaction history? This cannot be undone.")) {
                    setTransactions([]); 
                    localStorage.removeItem(`transactions_${user.email}`);
                }
            };

            const generatePDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFontSize(18);
                doc.text(`Expense Statement - ${profile.name}`, 14, 20);
                doc.setFontSize(12);
                doc.text(`Date: ${new Date().toLocaleDateString()}`, 14, 30);
                doc.text(`Salary: ${profile.currency}${profile.salary}`, 14, 38);
                doc.text(`Balance Remaining: ${profile.currency}${balance}`, 14, 46);

                const tableData = transactions.map(t => [t.date, t.desc, `${profile.currency}${t.amount}`]);

                doc.autoTable({
                    startY: 55,
                    head: [['Date', 'Description', 'Amount']],
                    body: tableData,
                    theme: 'grid',
                    headStyles: { fillColor: [79, 70, 229] }, 
                });

                doc.save(`Statement_${profile.name}.pdf`);
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-10">
                    {/* Header */}
                    <div className="bg-indigo-600 pb-24 pt-10 text-white rounded-b-[3rem] shadow-lg">
                        <div className="container mx-auto px-6">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-indigo-200 text-sm">Welcome back,</p>
                                    <h1 className="text-2xl font-bold">{profile.name}</h1>
                                </div>
                                <button onClick={onLogout} className="rounded-full bg-white/20 p-2 hover:bg-white/30 transition">
                                    <i className="fa-solid fa-arrow-right-from-bracket text-white"></i>
                                </button>
                            </div>
                            <div className="mt-8 text-center">
                                <p className="text-indigo-200">Total Balance</p>
                                <h2 className="text-4xl font-bold mt-2">{profile.currency} {balance}</h2>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="container mx-auto px-6 -mt-16">
                        {/* Stats Card */}
                        <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-gray-500 font-semibold">Monthly Salary</h3>
                                <span className="text-green-600 font-bold">{profile.currency} {profile.salary}</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <h3 className="text-gray-500 font-semibold">Total Expenses</h3>
                                <span className="text-red-500 font-bold">- {profile.currency} {totalExpenses}</span>
                            </div>
                        </div>

                        {/* Action Buttons */}
                        <div className="flex flex-wrap gap-2 mt-4">
                            <button 
                                onClick={addTransaction}
                                className="flex-1 min-w-[120px] py-3 rounded-xl font-bold text-white bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 transition-all shadow-md active:scale-95 flex items-center justify-center gap-2"
                            >
                                <i className="fa-solid fa-plus"></i> Add
                            </button>
                            <button 
                                onClick={removeTransaction}
                                className="flex-1 min-w-[120px] py-3 rounded-xl font-bold text-white bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-600 hover:to-rose-700 transition-all shadow-md active:scale-95 flex items-center justify-center gap-2"
                            >
                                <i className="fa-solid fa-minus"></i> Remove
                            </button>
                        </div>

                        <div className="flex gap-2 mt-3">
                            <button 
                                onClick={generatePDF}
                                className="flex-1 py-2 px-4 rounded-lg font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 transition-colors flex items-center justify-center gap-2"
                            >
                                <i className="fa-solid fa-file-pdf"></i> Statement
                            </button>
                            
                            {/* --- NEW RESET BUTTON --- */}
                            <button 
                                onClick={clearAllTransactions}
                                className="py-2 px-4 rounded-lg font-semibold text-gray-600 bg-gray-200 hover:bg-gray-300 transition-colors flex items-center justify-center gap-2"
                            >
                                <i className="fa-solid fa-trash-can"></i> Reset
                            </button>
                        </div>

                        {/* Transactions List */}
                        <div className="mt-8">
                            <h3 className="text-lg font-bold text-gray-800 mb-4">Recent Transactions</h3>
                            <div className="space-y-3">
                                {transactions.length === 0 ? (
                                    <p className="text-center text-gray-400 italic py-4">No expenses yet!</p>
                                ) : (
                                    transactions.map((t) => (
                                        <div key={t.id} className="flex items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                            <div className="flex items-center gap-3">
                                                <div className="bg-red-100 p-2 rounded-full text-red-500">
                                                    <i className="fa-solid fa-bag-shopping"></i>
                                                </div>
                                                <div>
                                                    <p className="font-bold text-gray-800">{t.desc}</p>
                                                    <p className="text-xs text-gray-400">{t.date}</p>
                                                </div>
                                            </div>
                                            <span className="font-bold text-red-500">-{profile.currency}{t.amount}</span>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 4. MAIN APP COMPONENT ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    if (currentUser) {
                        setUser(currentUser);
                        const savedProfile = localStorage.getItem(`profile_${currentUser.email}`);
                        if (savedProfile) setProfile(JSON.parse(savedProfile));
                    } else {
                        setUser(null);
                        setProfile(null);
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const handleOnboardingComplete = (details) => {
                setProfile(details);
                localStorage.setItem(`profile_${user.email}`, JSON.stringify(details));
            };

            const handleLogout = () => {
                auth.signOut().then(() => {
                    setUser(null);
                    setProfile(null);
                });
            };

            if (loading) return <div className="flex h-screen items-center justify-center text-indigo-600"><i className="fa-solid fa-circle-notch fa-spin text-3xl"></i></div>;

            if (!user) return <Login />;
            if (!profile) return <Onboarding user={user} onComplete={handleOnboardingComplete} />;
            return <Dashboard user={user} profile={profile} onLogout={handleLogout} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('Service Worker Registered!', reg.scope))
            .catch((err) => console.log('Service Worker Failed:', err));
        });
      }
    </script>
</body>
</html>
