<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <title>Track Your Expense - Account Portal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <!-- CHANGE 1: FIREBASE COMPAT LIBRARIES (Required for single-file apps) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // CHANGE 1 CONTINUED: YOUR REAL CONFIG FROM SCREENSHOT
        const firebaseConfig = {
            apiKey: "AIzaSyDUom1M1DuOG73ezjmjcXAH5YCnOTmftdc",
  authDomain: "track-your-expense-d253f.firebaseapp.com",
  projectId: "track-your-expense-d253f",
  storageBucket: "track-your-expense-d253f.firebasestorage.app",
  messagingSenderId: "808570038456",
  appId: "1:808570038456:web:8f9c5005bc2e6fc5a22c4d",
  measurementId: "G-H11W1EN2G6"
        };

        // Initialize Firebase immediately
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .slide-in { animation: slideIn 0.4s ease-out; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- HELPER FUNCTIONS ---
        const generateTxnId = () => {
            const date = new Date().toISOString().slice(0,10).replace(/-/g,"");
            const random = Math.floor(Math.random() * 16777215).toString(16).toUpperCase().padStart(6, '0');
            return `TXN-${date}-${random}`;
        };

        const formatCurrency = (amount) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(amount);
        const formatDate = (dateStr) => {
            const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return new Date(dateStr).toLocaleDateString('en-IN', options);
        };

        // --- COMPONENTS ---

       // 1. Login Component (CHANGE 2: REAL LOGIN LOGIC)
        const Login = ({ onLogin }) => {
            const handleGoogleLogin = () => {
                // Using the global 'auth' and 'provider' variables we set up in <head>
                auth.signInWithPopup(provider)
                    .then((result) => {
                        // Successful login!
                        // Note: The main App component handles the state update via onAuthStateChanged
                        // But we can trigger a manual update here just in case
                        const user = result.user;
                        const userData = {
                            displayName: user.displayName,
                            email: user.email,
                            photoURL: user.photoURL
                        };
                        // No need to call onLogin manually if using onAuthStateChanged listener, 
                        // but it acts as a fallback.
                    })
                    .catch((error) => {
                        console.error("Error signing in", error);
                        alert("Login failed: " + error.message);
                    });
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 to-blue-500 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md text-center slide-in">
                        <div className="mb-6 flex justify-center">
                            <div className="bg-indigo-100 p-4 rounded-full">
                                <i className="fa-solid fa-wallet text-4xl text-indigo-600"></i>
                            </div>
                        </div>
                        <h1 className="text-3xl font-bold text-slate-800 mb-2">Track Your Expense</h1>
                        <p className="text-slate-500 mb-8">Secure Account Statement Portal</p>
                        
                        <button 
                            onClick={handleGoogleLogin}
                            className="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-sm hover:shadow-md"
                        >
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-6 h-6" alt="Google" />
                            Sign in with Gmail
                        </button>

                        <div className="mt-8 text-xs text-slate-400 border-t pt-4">
                            <p>By signing in, you agree to our Terms of Service.</p>
                            <p className="mt-2">Commercial & Personal Finance Management</p>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. Onboarding Component
        const Onboarding = ({ user, onComplete }) => {
            const [step, setStep] = useState(1);
            const [details, setDetails] = useState({
                type: '', 
                fullName: user.displayName || '',
                shopName: '',
                franchiseName: '',
                phone: '',
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                onComplete(details);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                    <div className="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden slide-in">
                        <div className="bg-indigo-600 p-6 text-white">
                            <h2 className="text-2xl font-bold">Welcome, {user.displayName ? user.displayName.split(' ')[0] : 'User'}!</h2>
                            <p className="opacity-90">Let's set up your account profile.</p>
                        </div>
                        
                        <div className="p-8">
                            {step === 1 && (
                                <div>
                                    <h3 className="text-lg font-semibold mb-6 text-slate-700">How will you use this portal?</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <button 
                                            onClick={() => { setDetails({...details, type: 'personal'}); setStep(2); }}
                                            className="p-6 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition group text-center"
                                        >
                                            <i className="fa-solid fa-user text-3xl text-slate-400 group-hover:text-indigo-600 mb-3"></i>
                                            <div className="font-bold text-slate-700">Personal Use</div>
                                            <div className="text-xs text-slate-500 mt-1">Track daily expenses</div>
                                        </button>
                                        <button 
                                            onClick={() => { setDetails({...details, type: 'commercial'}); setStep(2); }}
                                            className="p-6 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition group text-center"
                                        >
                                            <i className="fa-solid fa-store text-3xl text-slate-400 group-hover:text-indigo-600 mb-3"></i>
                                            <div className="font-bold text-slate-700">Commercial Use</div>
                                            <div className="text-xs text-slate-500 mt-1">Shop & Franchise</div>
                                        </button>
                                    </div>
                                </div>
                            )}

                            {step === 2 && (
                                <form onSubmit={handleSubmit}>
                                    <h3 className="text-lg font-semibold mb-4 text-slate-700">
                                        Enter {details.type === 'commercial' ? 'Business' : 'Personal'} Details
                                    </h3>
                                    
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-600 mb-1">Full Name</label>
                                            <input 
                                                required type="text" className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none"
                                                value={details.fullName} onChange={e => setDetails({...details, fullName: e.target.value})}
                                            />
                                        </div>

                                        {details.type === 'commercial' && (
                                            <>
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-600 mb-1">Shop / Business Name</label>
                                                    <input 
                                                        required type="text" className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none"
                                                        value={details.shopName} onChange={e => setDetails({...details, shopName: e.target.value})}
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-600 mb-1">Franchise / GST (Optional)</label>
                                                    <input 
                                                        type="text" className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none"
                                                        value={details.franchiseName} onChange={e => setDetails({...details, franchiseName: e.target.value})}
                                                    />
                                                </div>
                                            </>
                                        )}
                                        
                                        <div>
                                            <label className="block text-sm font-medium text-slate-600 mb-1">Contact Number</label>
                                            <input 
                                                required type="tel" className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none"
                                                value={details.phone} onChange={e => setDetails({...details, phone: e.target.value})}
                                            />
                                        </div>
                                    </div>

                                    <div className="mt-6 flex gap-3">
                                        <button type="button" onClick={() => setStep(1)} className="px-4 py-2 text-slate-600 hover:underline">Back</button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 transition">
                                            Complete Setup
                                        </button>
                                    </div>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // 3. Dashboard & Main Logic
        const Dashboard = ({ user, profile, onLogout }) => {
            const [transactions, setTransactions] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalType, setModalType] = useState('credit'); // 'credit' or 'debit'
            const [form, setForm] = useState({ amount: '', partyName: '', mode: 'UPI', remarks: '' });

            // Load Transactions
            useEffect(() => {
                const saved = localStorage.getItem(`expenses_${user.email}`);
                if (saved) setTransactions(JSON.parse(saved));
            }, [user.email]);

            // Save Transactions
            useEffect(() => {
                localStorage.setItem(`expenses_${user.email}`, JSON.stringify(transactions));
            }, [transactions, user.email]);

            const totals = useMemo(() => {
                return transactions.reduce((acc, curr) => {
                    if (curr.type === 'credit') acc.income += parseFloat(curr.amount);
                    else acc.expense += parseFloat(curr.amount);
                    return acc;
                }, { income: 0, expense: 0 });
            }, [transactions]);

            const balance = totals.income - totals.expense;

            const handleAddTransaction = (e) => {
                e.preventDefault();
                const newTxn = {
                    id: generateTxnId(),
                    date: new Date().toISOString(),
                    type: modalType,
                    amount: parseFloat(form.amount),
                    partyName: form.partyName,
                    mode: form.mode,
                    remarks: form.remarks
                };
                setTransactions([newTxn, ...transactions]);
                setIsModalOpen(false);
                setForm({ amount: '', partyName: '', mode: 'UPI', remarks: '' });
            };

            // --- PDF GENERATION (With Branding) ---
            const downloadPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                // Header Background
                doc.setFillColor(79, 70, 229); 
                doc.rect(0, 0, 210, 45, 'F');
                
                // Website Name
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(24);
                doc.text("Track Your Expense", 14, 18);

                // User/Shop Name
                doc.setFontSize(14);
                doc.text(profile.shopName || profile.fullName, 14, 28);

                doc.setFontSize(10);
                doc.setTextColor(200, 200, 255);
                doc.text("Official Account Statement", 14, 36);

                // Profile Info
                doc.setTextColor(0, 0, 0);
                doc.setFontSize(10);
                doc.text(`Generated by: ${profile.fullName}`, 14, 60);
                doc.text(`Email: ${user.email}`, 14, 66);
                doc.text(`Date: ${new Date().toLocaleDateString()}`, 160, 60);
                if(profile.franchiseName) doc.text(`Franchise/GST: ${profile.franchiseName}`, 14, 72);

                // Summary
                let summaryY = profile.franchiseName ? 80 : 74;
                doc.setDrawColor(200);
                doc.line(14, summaryY, 196, summaryY);
                doc.text(`Total Credited: ${totals.income.toFixed(2)}`, 14, summaryY + 10);
                doc.text(`Total Debited: ${totals.expense.toFixed(2)}`, 80, summaryY + 10);
                doc.setFont("helvetica", "bold");
                doc.text(`Net Balance: ${balance.toFixed(2)}`, 150, summaryY + 10);
                doc.setFont("helvetica", "normal");

                // Table
                const tableColumn = ["Txn ID", "Date", "Details/Party", "Mode", "Credit (+)", "Debit (-)"];
                const tableRows = transactions.map(txn => [
                    txn.id,
                    new Date(txn.date).toLocaleDateString(),
                    txn.partyName + (txn.remarks ? ` (${txn.remarks})` : ''),
                    txn.mode,
                    txn.type === 'credit' ? txn.amount.toFixed(2) : '-',
                    txn.type === 'debit' ? txn.amount.toFixed(2) : '-',
                ]);

                doc.autoTable({
                    head: [tableColumn],
                    body: tableRows,
                    startY: summaryY + 20,
                    theme: 'grid',
                    headStyles: { fillColor: [79, 70, 229] },
                    styles: { fontSize: 9 },
                });

                // Footer
                const pageCount = doc.internal.getNumberOfPages();
                for (let i = 1; i <= pageCount; i++) {
                    doc.setPage(i);
                    doc.setFontSize(8);
                    doc.setTextColor(100);
                    doc.setDrawColor(200);
                    doc.line(10, 285, 200, 285);
                    doc.text('Powered by Track Your Expense | Developed by Bhavishya Gupta | bhavishyagupta22@gmail.com', 105, 292, { align: 'center' });
                }

                doc.save(`${profile.fullName.replace(/\s+/g, '_')}_Statement.pdf`);
            };

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col">
                    {/* Navbar */}
                    <nav className="bg-white shadow-sm z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16">
                                <div className="flex items-center gap-2">
                                    <i className="fa-solid fa-chart-pie text-indigo-600 text-xl"></i>
                                    <span className="font-bold text-xl text-slate-800">Track Your Expense</span>
                                </div>
                                <div className="flex items-center gap-4">
                                    <div className="text-right hidden sm:block">
                                        <div className="text-sm font-medium text-slate-900">{profile.fullName}</div>
                                        <div className="text-xs text-slate-500">{profile.type === 'commercial' ? profile.shopName : 'Personal Account'}</div>
                                    </div>
                                    <img className="h-8 w-8 rounded-full border" src={user.photoURL || `https://ui-avatars.com/api/?name=${user.displayName}`} alt="" />
                                    <button onClick={onLogout} className="text-slate-400 hover:text-red-500"><i className="fa-solid fa-right-from-bracket text-xl"></i></button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                                <div className="text-sm text-slate-500">Total Received</div>
                                <div className="text-2xl font-bold text-green-600">{formatCurrency(totals.income)}</div>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-red-500">
                                <div className="text-sm text-slate-500">Total Paid</div>
                                <div className="text-2xl font-bold text-red-600">{formatCurrency(totals.expense)}</div>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-indigo-500">
                                <div className="text-sm text-slate-500">Available Balance</div>
                                <div className={`text-2xl font-bold ${balance >= 0 ? 'text-indigo-600' : 'text-red-600'}`}>{formatCurrency(balance)}</div>
                            </div>
                        </div>

                        <div className="bg-white rounded-t-xl p-4 border-b flex flex-col sm:flex-row justify-between items-center gap-4">
                            <h2 className="text-lg font-bold text-slate-800">Transactions</h2>
                            <div className="flex gap-2">
                                <button onClick={() => { setModalType('credit'); setIsModalOpen(true); }} className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm flex items-center gap-2"><i className="fa-solid fa-plus"></i> Add Money</button>
                                <button onClick={() => { setModalType('debit'); setIsModalOpen(true); }} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm flex items-center gap-2"><i className="fa-solid fa-minus"></i> Remove Money</button>
                                <button onClick={downloadPDF} className="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm flex items-center gap-2"><i className="fa-solid fa-file-pdf"></i> Statement</button>
                            </div>
                        </div>

                        <div className="bg-white rounded-b-xl shadow-sm overflow-hidden min-h-[400px]">
                            <div className="overflow-x-auto">
                                <table className="min-w-full divide-y divide-slate-200">
                                    <thead className="bg-slate-50">
                                        <tr>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Date / ID</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Party Details</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Mode</th>
                                            <th className="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-slate-200">
                                        {transactions.length === 0 ? (
                                            <tr><td colSpan="4" className="px-6 py-12 text-center text-slate-400"><i className="fa-solid fa-receipt text-4xl mb-2"></i><p>No transactions yet.</p></td></tr>
                                        ) : (
                                            transactions.map((txn) => (
                                                <tr key={txn.id} className="hover:bg-slate-50 transition">
                                                    <td className="px-6 py-4 whitespace-nowrap"><div className="text-sm font-medium text-slate-900">{formatDate(txn.date).split(',')[0]}</div><div className="text-xs text-slate-500 font-mono">{txn.id}</div></td>
                                                    <td className="px-6 py-4"><div className="text-sm font-medium text-slate-900">{txn.partyName}</div><div className="text-xs text-slate-500">{txn.remarks || 'No remarks'}</div></td>
                                                    <td className="px-6 py-4 whitespace-nowrap"><span className="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-slate-100 text-slate-800">{txn.mode}</span></td>
                                                    <td className={`px-6 py-4 whitespace-nowrap text-right text-sm font-bold ${txn.type === 'credit' ? 'text-green-600' : 'text-red-600'}`}>{txn.type === 'credit' ? '+' : '-'} {formatCurrency(txn.amount)}</td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    <footer className="bg-white border-t mt-auto py-6">
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <p className="text-slate-500 text-sm mb-2">&copy; 2025 Track Your Expense. All Rights Reserved.</p>
                            <p className="text-slate-400 text-xs font-mono">Developed by Bhavishya Gupta <span className="mx-2">|</span> <a href="mailto:bhavishyagupta22@gmail.com" className="hover:text-indigo-500 transition">bhavishyagupta22@gmail.com</a></p>
                        </div>
                    </footer>

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden slide-in">
                                <div className={`p-4 ${modalType === 'credit' ? 'bg-green-600' : 'bg-red-600'} text-white flex justify-between items-center`}>
                                    <h3 className="text-lg font-bold">{modalType === 'credit' ? 'Add Income' : 'Add Expense'}</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="hover:text-slate-200"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <form onSubmit={handleAddTransaction} className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Amount (₹)</label>
                                        <input type="number" required min="1" className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-xl font-bold" placeholder="0.00" value={form.amount} onChange={e => setForm({...form, amount: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">{modalType === 'credit' ? 'Received From' : 'Paid To'}</label>
                                        <input type="text" required className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="Name" value={form.partyName} onChange={e => setForm({...form, partyName: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Mode</label>
                                            <select className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500" value={form.mode} onChange={e => setForm({...form, mode: e.target.value})}>
                                                <option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option><option>Cheque</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Remarks</label>
                                            <input type="text" className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="Details..." value={form.remarks} onChange={e => setForm({...form, remarks: e.target.value})} />
                                        </div>
                                    </div>
                                    <button type="submit" className={`w-full py-3 rounded-lg text-white font-bold shadow-md transition ${modalType === 'credit' ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}`}>Confirm</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- MAIN APP (CHANGE 3: PERSISTENT AUTH) ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                // This is the critical part: We listen to Firebase to tell us if 
                // the user is logged in or not, and it handles page refreshes automatically.
                const unsubscribe = auth.onAuthStateChanged((firebaseUser) => {
                    if (firebaseUser) {
                        const userData = {
                            displayName: firebaseUser.displayName,
                            email: firebaseUser.email,
                            photoURL: firebaseUser.photoURL
                        };
                        setUser(userData);
                        // Try to load their profile from LocalStorage if they've been here before
                        const savedProfile = localStorage.getItem(`profile_${firebaseUser.email}`);
                        if (savedProfile) {
                            setProfile(JSON.parse(savedProfile));
                        }
                    } else {
                        setUser(null);
                        setProfile(null);
                    }
                    setLoading(false);
                });

                // Cleanup listener on unmount
                return () => unsubscribe();
            }, []);

            const handleOnboardingComplete = (details) => {
                setProfile(details);
                // Save profile permanently linked to this specific email
                localStorage.setItem(`profile_${user.email}`, JSON.stringify(details));
            };

            const handleLogout = () => {
                auth.signOut().then(() => {
                    setUser(null);
                    setProfile(null);
                });
            };

            if (loading) return <div className="flex h-screen items-center justify-center text-indigo-600"><i className="fa-solid fa-circle-notch fa-spin text-3xl"></i></div>;

            if (!user) return <Login />;
            if (!profile) return <Onboarding user={user} onComplete={handleOnboardingComplete} />;
            return <Dashboard user={user} profile={profile} onLogout={handleLogout} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('Service Worker Registered!', reg.scope))
        .catch((err) => console.log('Service Worker Failed:', err));
    });
  }
</script>
</body>
</html>
