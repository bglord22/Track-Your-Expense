<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Prevent Caching to Fix Android Error -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link rel="manifest" href="./manifest.json">
    <title>Track Your Expense - Premium</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Charts.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <!-- FIREBASE SDKs (Complete Set to prevent crashes) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDUom1M1DuOG73ezjmjcXAH5YCnOTmftdc",
            authDomain: "track-your-expense-d253f.firebaseapp.com",
            projectId: "track-your-expense-d253f",
            storageBucket: "track-your-expense-d253f.firebasestorage.app",
            messagingSenderId: "808570038456",
            appId: "1:808570038456:web:8f9c5005bc2e6fc5a22c4d",
            measurementId: "G-H11W1EN2G6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        // Critical Fix: Initialize DB to stop cached app crashes
        const db = firebase.firestore(); 
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        /* Smooth transitions */
        .page-enter { animation: fadeUp 0.3s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Hide scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Glass effect */
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
    </style>
</head>
<body>

    <div id="root"></div>

    <!-- FORCE UPDATE SCRIPT -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister().then(() => console.log("Cache cleared for update."));
                } 
            });
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- UTILS ---
        const formatCurrency = (amount) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amount);
        const generateId = () => `TXN-${Date.now().toString().slice(-6)}-${Math.floor(Math.random()*1000)}`;

        // --- CHART COMPONENT ---
        const ChartCard = ({ title, type, data, options }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (canvasRef.current) {
                    if (chartRef.current) chartRef.current.destroy();
                    const ctx = canvasRef.current.getContext('2d');
                    chartRef.current = new Chart(ctx, { type, data, options });
                }
                return () => { if(chartRef.current) chartRef.current.destroy(); };
            }, [data, type]);

            return (
                <div className="bg-white p-4 rounded-2xl shadow-sm mb-4">
                    <h3 className="text-gray-500 text-xs font-bold uppercase tracking-wider mb-3">{title}</h3>
                    <div className="relative h-64 w-full">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                </div>
            );
        };

        // --- VIEW COMPONENTS ---

        const Login = () => {
            const signIn = async () => {
                try { await auth.signInWithPopup(provider); } 
                catch (e) { alert(e.message); }
            };
            return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700 p-6 text-white page-enter">
                    <div className="w-24 h-24 bg-white/20 backdrop-blur-lg rounded-3xl flex items-center justify-center mb-8 shadow-xl border border-white/30">
                        <i className="fa-solid fa-chart-pie text-5xl text-white"></i>
                    </div>
                    <h1 className="text-4xl font-bold mb-2 tracking-tight">Track Your Expense</h1>
                    <p className="text-indigo-200 mb-10 text-center max-w-xs">Your ultimate financial companion. Manage personal & business finances in one place.</p>
                    
                    <div className="bg-white/10 backdrop-blur-md border border-white/20 px-4 py-2 rounded-full text-xs font-mono mb-8 flex items-center gap-2">
                        <span className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> v5.0 Ultra Stable
                    </div>

                    <button onClick={signIn} className="w-full max-w-xs bg-white text-indigo-700 py-4 rounded-2xl font-bold shadow-lg hover:scale-105 transition-transform flex items-center justify-center gap-3">
                        <i className="fa-brands fa-google text-xl"></i> Continue with Google
                    </button>
                </div>
            );
        };

        const DashboardView = ({ transactions, profile, onAdd, onRemove, onStatement }) => {
            const stats = useMemo(() => {
                const income = transactions.filter(t => t.type === 'credit').reduce((acc, t) => acc + t.amount, 0);
                const expense = transactions.filter(t => t.type === 'debit').reduce((acc, t) => acc + t.amount, 0);
                return { income, expense, balance: income - expense };
            }, [transactions]);

            return (
                <div className="pb-24 page-enter">
                    {/* Header Card */}
                    <div className="bg-indigo-600 pt-12 pb-20 px-6 rounded-b-[3rem] shadow-xl text-white relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                        <div className="relative z-10 flex justify-between items-start mb-6">
                            <div>
                                <p className="text-indigo-200 text-sm font-medium">Total Balance</p>
                                <h1 className="text-4xl font-bold mt-1">{formatCurrency(stats.balance)}</h1>
                            </div>
                            <div className="bg-white/20 backdrop-blur-sm px-3 py-1 rounded-lg text-xs font-bold border border-white/30">
                                {profile.type === 'commercial' ? '🏢 BUSINESS' : '👤 PERSONAL'}
                            </div>
                        </div>
                        <div className="relative z-10 grid grid-cols-2 gap-4">
                            <div className="bg-white/10 backdrop-blur-md p-3 rounded-xl border border-white/10">
                                <div className="text-indigo-200 text-xs mb-1"><i className="fa-solid fa-arrow-down text-green-400 mr-1"></i> Income</div>
                                <div className="font-bold text-lg">{formatCurrency(stats.income)}</div>
                            </div>
                            <div className="bg-white/10 backdrop-blur-md p-3 rounded-xl border border-white/10">
                                <div className="text-indigo-200 text-xs mb-1"><i className="fa-solid fa-arrow-up text-red-400 mr-1"></i> Spent</div>
                                <div className="font-bold text-lg">{formatCurrency(stats.expense)}</div>
                            </div>
                        </div>
                    </div>

                    <div className="px-6 -mt-8 relative z-20">
                        {/* Quick Actions */}
                        <div className="bg-white p-2 rounded-2xl shadow-lg flex justify-between mb-6">
                            <button onClick={onAdd} className="flex-1 flex flex-col items-center py-3 hover:bg-gray-50 rounded-xl transition">
                                <div className="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-600 mb-1"><i className="fa-solid fa-plus"></i></div>
                                <span className="text-xs font-bold text-gray-600">Deposit</span>
                            </button>
                            <div className="w-px bg-gray-100 my-2"></div>
                            <button onClick={onRemove} className="flex-1 flex flex-col items-center py-3 hover:bg-gray-50 rounded-xl transition">
                                <div className="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center text-red-600 mb-1"><i className="fa-solid fa-minus"></i></div>
                                <span className="text-xs font-bold text-gray-600">Withdraw</span>
                            </button>
                            <div className="w-px bg-gray-100 my-2"></div>
                            <button onClick={onStatement} className="flex-1 flex flex-col items-center py-3 hover:bg-gray-50 rounded-xl transition">
                                <div className="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 mb-1"><i className="fa-solid fa-file-pdf"></i></div>
                                <span className="text-xs font-bold text-gray-600">PDF</span>
                            </button>
                        </div>

                        {/* Transactions */}
                        <h3 className="text-gray-800 font-bold text-lg mb-4">Recent Activity</h3>
                        <div className="space-y-3">
                            {transactions.length === 0 && (
                                <div className="text-center py-10 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-300">
                                    <i className="fa-solid fa-receipt text-3xl mb-2 opacity-50"></i>
                                    <p>No transactions yet</p>
                                </div>
                            )}
                            {transactions.map((t) => (
                                <div key={t.id} className="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center border border-gray-50">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center text-lg ${t.type === 'credit' ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600'}`}>
                                            <i className={`fa-solid ${t.mode === 'UPI' ? 'fa-qrcode' : t.mode === 'Cash' ? 'fa-coins' : 'fa-building-columns'}`}></i>
                                        </div>
                                        <div>
                                            <p className="font-bold text-gray-800 text-sm">{t.partyName}</p>
                                            <p className="text-xs text-gray-400">{new Date(t.date).toLocaleDateString()} • {t.mode}</p>
                                        </div>
                                    </div>
                                    <div className={`font-bold ${t.type === 'credit' ? 'text-green-600' : 'text-red-600'}`}>
                                        {t.type === 'credit' ? '+' : '-'}{formatCurrency(t.amount)}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const AnalyticsView = ({ transactions }) => {
            // Prepare Chart Data
            const chartData = useMemo(() => {
                // 1. Daily Trends
                const days = {};
                transactions.forEach(t => {
                    const date = new Date(t.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
                    if (!days[date]) days[date] = { credit: 0, debit: 0 };
                    if (t.type === 'credit') days[date].credit += t.amount;
                    else days[date].debit += t.amount;
                });
                const labels = Object.keys(days).slice(-7); // Last 7 active days
                const credits = labels.map(d => days[d].credit);
                const debits = labels.map(d => days[d].debit);

                // 2. Modes
                const modes = {};
                transactions.forEach(t => {
                    if (!modes[t.mode]) modes[t.mode] = 0;
                    modes[t.mode] += t.amount;
                });

                return {
                    line: {
                        labels,
                        datasets: [
                            { label: 'Income', data: credits, borderColor: '#10b981', tension: 0.4, fill: false },
                            { label: 'Expense', data: debits, borderColor: '#ef4444', tension: 0.4, fill: false }
                        ]
                    },
                    doughnut: {
                        labels: Object.keys(modes),
                        datasets: [{ data: Object.values(modes), backgroundColor: ['#6366f1', '#f59e0b', '#10b981', '#ec4899'] }]
                    }
                };
            }, [transactions]);

            return (
                <div className="pt-12 px-6 pb-24 page-enter">
                    <h1 className="text-2xl font-bold text-gray-800 mb-6">Financial Insights</h1>
                    
                    {transactions.length < 2 ? (
                        <div className="bg-indigo-50 p-6 rounded-2xl text-center text-indigo-800">
                            <p>Add more transactions to see your graphs!</p>
                        </div>
                    ) : (
                        <>
                            <ChartCard 
                                title="Income vs Expense (Daily)" 
                                type="line" 
                                data={chartData.line} 
                                options={{ responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }} 
                            />
                            <div className="grid grid-cols-1 gap-4">
                                <ChartCard 
                                    title="Payment Modes Volume" 
                                    type="doughnut" 
                                    data={chartData.doughnut} 
                                    options={{ responsive: true, maintainAspectRatio: false, cutout: '70%' }} 
                                />
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const SettingsView = ({ profile, user, onLogout, onReset, onDelete, onUpdateProfile }) => {
            const toggleType = () => {
                const newType = profile.type === 'commercial' ? 'personal' : 'commercial';
                onUpdateProfile({ ...profile, type: newType });
            };

            return (
                <div className="pt-12 px-6 pb-24 page-enter">
                    <h1 className="text-2xl font-bold text-gray-800 mb-6">Settings</h1>
                    
                    <div className="bg-white p-6 rounded-2xl shadow-sm mb-6 flex items-center gap-4">
                        <img src={user.photoURL} className="w-16 h-16 rounded-full border-2 border-indigo-100" />
                        <div>
                            <h2 className="font-bold text-lg">{profile.fullName}</h2>
                            <p className="text-gray-500 text-sm">{user.email}</p>
                            <span className="inline-block bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2 py-1 rounded-full mt-1">
                                {profile.type.toUpperCase()}
                            </span>
                        </div>
                    </div>

                    <div className="space-y-4">
                        <div className="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
                            <div>
                                <h4 className="font-bold text-gray-700">Business Mode</h4>
                                <p className="text-xs text-gray-400">Enable features for shop owners</p>
                            </div>
                            <button onClick={toggleType} className={`w-12 h-6 rounded-full transition-colors relative ${profile.type === 'commercial' ? 'bg-indigo-600' : 'bg-gray-300'}`}>
                                <div className={`w-4 h-4 bg-white rounded-full absolute top-1 transition-all ${profile.type === 'commercial' ? 'left-7' : 'left-1'}`}></div>
                            </button>
                        </div>

                        <button onClick={onReset} className="w-full bg-white p-4 rounded-xl shadow-sm flex items-center gap-3 text-orange-600 font-bold hover:bg-orange-50 transition">
                            <i className="fa-solid fa-eraser"></i> Clear Transaction History
                        </button>
                        
                        <button onClick={onLogout} className="w-full bg-white p-4 rounded-xl shadow-sm flex items-center gap-3 text-gray-600 font-bold hover:bg-gray-50 transition">
                            <i className="fa-solid fa-right-from-bracket"></i> Sign Out
                        </button>

                        <div className="pt-8 border-t border-gray-200">
                            <h4 className="text-red-500 font-bold text-sm mb-2 uppercase">Danger Zone</h4>
                            <button onClick={onDelete} className="w-full bg-red-50 p-4 rounded-xl border border-red-100 text-red-600 font-bold flex items-center justify-center gap-2 hover:bg-red-100 transition">
                                <i className="fa-solid fa-skull"></i> Permanently Delete Account
                            </button>
                        </div>
                    </div>
                    
                    <div className="mt-12 text-center text-xs text-gray-400">
                        <p>Track Your Expense v5.0</p>
                        <p>Developed by Bhavishya Gupta</p>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---

        const App = () => {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [view, setView] = useState('dashboard'); // dashboard, analytics, settings
            const [transactions, setTransactions] = useState([]);
            const [loading, setLoading] = useState(true);
            
            // Modals
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalType, setModalType] = useState('credit');
            const [form, setForm] = useState({ amount: '', partyName: '', mode: 'UPI', remarks: '' });

            useEffect(() => {
                const unsub = auth.onAuthStateChanged((u) => {
                    if (u) {
                        setUser(u);
                        const savedProfile = localStorage.getItem(`profile_${u.email}`);
                        if (savedProfile) setProfile(JSON.parse(savedProfile));
                        
                        const savedTxns = localStorage.getItem(`expenses_${u.email}`);
                        if (savedTxns) setTransactions(JSON.parse(savedTxns));
                    } else {
                        setUser(null); setProfile(null);
                    }
                    setLoading(false);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                if(user) localStorage.setItem(`expenses_${user.email}`, JSON.stringify(transactions));
            }, [transactions, user]);

            const updateProfile = (newProfile) => {
                setProfile(newProfile);
                localStorage.setItem(`profile_${user.email}`, JSON.stringify(newProfile));
            };

            const addTxn = (e) => {
                e.preventDefault();
                if(!form.amount || !form.partyName) return;
                const newT = { id: generateId(), date: new Date().toISOString(), type: modalType, ...form, amount: parseFloat(form.amount) };
                setTransactions([newT, ...transactions]);
                setIsModalOpen(false);
                setForm({ amount: '', partyName: '', mode: 'UPI', remarks: '' });
            };

            const resetData = () => {
                if(confirm("Reset all transactions? This cannot be undone.")) setTransactions([]);
            };

            const deleteAccount = async () => {
                if(confirm("PERMANENTLY DELETE ACCOUNT? All data will be lost forever.")) {
                    localStorage.clear();
                    try { await auth.currentUser.delete(); } catch(e) { await auth.signOut(); }
                    window.location.reload();
                }
            };

            const generatePDF = () => {
                const doc = new window.jspdf.jsPDF();
                doc.setFillColor(79, 70, 229); doc.rect(0,0,210,40,'F');
                doc.setTextColor(255,255,255); doc.setFontSize(22); doc.text("Track Your Expense", 14, 20);
                doc.setFontSize(12); doc.text("Official Statement", 14, 30);
                
                doc.setTextColor(0,0,0); doc.setFontSize(10);
                doc.text(`User: ${profile.fullName} (${profile.type})`, 14, 50);
                doc.text(`Email: bhavishyagupta22@gmail.com`, 14, 56); // Hardcoded dev email as requested
                doc.text(`Generated: ${new Date().toLocaleDateString()}`, 150, 50);
                
                const rows = transactions.map(t => [new Date(t.date).toLocaleDateString(), t.partyName, t.mode, t.type==='credit'?t.amount:'-', t.type==='debit'?t.amount:'-']);
                doc.autoTable({ head: [['Date', 'Party', 'Mode', 'Credit', 'Debit']], body: rows, startY: 65, theme: 'grid', headStyles: {fillColor: [79, 70, 229]} });
                
                doc.setFontSize(8); doc.setTextColor(150);
                doc.text("Developed by Bhavishya Gupta | bhavishyagupta22@gmail.com", 105, 290, {align:'center'});
                doc.save(`Statement_${profile.fullName}.pdf`);
            };

            if (loading) return <div className="h-screen flex items-center justify-center text-indigo-600"><i className="fa-solid fa-circle-notch fa-spin text-3xl"></i></div>;
            if (!user) return <Login />;
            if (!profile) return <Onboarding user={user} onComplete={(d) => updateProfile(d)} />;

            return (
                <div className="max-w-md mx-auto bg-gray-50 min-h-screen shadow-2xl overflow-hidden relative">
                    {/* View Renderer */}
                    {view === 'dashboard' && <DashboardView transactions={transactions} profile={profile} onAdd={()=>{setModalType('credit');setIsModalOpen(true)}} onRemove={()=>{setModalType('debit');setIsModalOpen(true)}} onStatement={generatePDF} />}
                    {view === 'analytics' && <AnalyticsView transactions={transactions} />}
                    {view === 'settings' && <SettingsView profile={profile} user={user} onLogout={()=>auth.signOut()} onReset={resetData} onDelete={deleteAccount} onUpdateProfile={updateProfile} />}

                    {/* Bottom Navigation Bar */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center pb-safe pt-3 pb-3 z-50 max-w-md mx-auto">
                        <button onClick={() => setView('dashboard')} className={`flex flex-col items-center gap-1 ${view === 'dashboard' ? 'text-indigo-600' : 'text-gray-400'}`}>
                            <i className="fa-solid fa-house text-xl"></i>
                            <span className="text-[10px] font-bold">Home</span>
                        </button>
                        <button onClick={() => setView('analytics')} className={`flex flex-col items-center gap-1 ${view === 'analytics' ? 'text-indigo-600' : 'text-gray-400'}`}>
                            <i className="fa-solid fa-chart-simple text-xl"></i>
                            <span className="text-[10px] font-bold">Insights</span>
                        </button>
                        <button onClick={() => setView('settings')} className={`flex flex-col items-center gap-1 ${view === 'settings' ? 'text-indigo-600' : 'text-gray-400'}`}>
                            <i className="fa-solid fa-gear text-xl"></i>
                            <span className="text-[10px] font-bold">Settings</span>
                        </button>
                    </div>

                    {/* Add Transaction Modal */}
                    {isModalOpen && (
                        <div className="absolute inset-0 z-50 flex items-end bg-black/50 backdrop-blur-sm page-enter" onClick={(e) => e.target === e.currentTarget && setIsModalOpen(false)}>
                            <div className="bg-white w-full rounded-t-3xl p-6 pb-10 animate-slide-up">
                                <div className="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                                <h3 className={`text-xl font-bold mb-6 ${modalType === 'credit' ? 'text-green-600' : 'text-red-600'}`}>
                                    {modalType === 'credit' ? 'Receive Money' : 'Pay Money'}
                                </h3>
                                <form onSubmit={addTxn} className="space-y-4">
                                    <input type="number" placeholder="Amount (₹)" required className="w-full text-3xl font-bold text-gray-800 border-b-2 border-gray-200 focus:border-indigo-600 outline-none py-2" autoFocus value={form.amount} onChange={e=>setForm({...form, amount: e.target.value})} />
                                    <input type="text" placeholder="Party Name / Description" required className="w-full bg-gray-100 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500" value={form.partyName} onChange={e=>setForm({...form, partyName: e.target.value})} />
                                    <div className="flex gap-2 overflow-x-auto no-scrollbar py-2">
                                        {['UPI', 'Cash', 'Bank', 'Card'].map(m => (
                                            <button type="button" key={m} onClick={()=>setForm({...form, mode: m})} className={`px-4 py-2 rounded-full text-sm font-bold border ${form.mode === m ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-600 border-gray-200'}`}>
                                                {m}
                                            </button>
                                        ))}
                                    </div>
                                    <button type="submit" className={`w-full py-4 rounded-xl text-white font-bold shadow-lg ${modalType === 'credit' ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}`}>
                                        Confirm Transaction
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
